<style>
:root{
  --ground:#E9EEF3; --phone:#FBFAF7; --surface:#FFFFFF; --sunk:#F1F3F6;
  --ink:#10233A; --ink-2:#4A5A6E; --ink-3:#7A8797; --line:#DEE3EA;
  --navy:#10233A; --on-navy:#FFFFFF;
  --yes:#3FAE63; --maybe:#F2C744; --no:#EE6A5B; --on-maybe:#3A2E05;
  --yes-soft:#E3F4E8; --maybe-soft:#FCF3D6; --no-soft:#FCE5E1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 18px 50px rgba(16,35,58,.16);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0B121B; --phone:#121B26; --surface:#18232F; --sunk:#1E2A38;
    --ink:#EEF2F6; --ink-2:#B3BECB; --ink-3:#8491A1; --line:#2A3848;
    --navy:#E9EEF4; --on-navy:#10233A;
    --yes-soft:#1D3526; --maybe-soft:#3A3217; --no-soft:#3D221E;
    --shadow:0 18px 50px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B121B; --phone:#121B26; --surface:#18232F; --sunk:#1E2A38;
  --ink:#EEF2F6; --ink-2:#B3BECB; --ink-3:#8491A1; --line:#2A3848;
  --navy:#E9EEF4; --on-navy:#10233A;
  --yes-soft:#1D3526; --maybe-soft:#3A3217; --no-soft:#3D221E;
  --shadow:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #5B9BE6;outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.phone{max-width:420px;margin:0 auto;background:var(--phone);border-radius:34px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;min-height:min(820px, calc(100% - 0px));position:relative}
@media (max-width:460px){body{padding-inline:0;padding-block:0}.phone{border-radius:0;box-shadow:none;min-height:100%}}
.screen{flex:1;display:flex;flex-direction:column;animation:fade .35s ease}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.proto{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);text-align:center;padding:10px 16px 0}

/* top bar */
.topbar{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:14px 16px 6px}
.topbar .t{text-align:center;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.iconbtn:hover{background:var(--sunk)}
.steps{display:flex;gap:6px;justify-content:center;padding:0 16px 10px}
.steps i{width:28px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}

/* home */
.home-hero{position:relative;padding:28px 22px 150px;min-height:420px;overflow:hidden}
.home-hero h1{font-size:44px;line-height:1;font-weight:800;color:#10233A;max-width:10ch}
.home-hero p{color:#2C3D52;max-width:30ch;margin:14px 0 22px;font-size:16px}
.home-hero{background:linear-gradient(180deg,#FBE3CB 0%,#F7C9A6 55%,#F2B48E 100%)}
.home-hero>.sky{position:absolute;left:0;right:0;bottom:0;top:auto;width:100%;height:190px;z-index:0;display:block}
.home-hero{padding-bottom:200px}
.home-hero>*:not(.sky){position:relative;z-index:1}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:var(--on-navy);font-weight:700;padding:15px 24px;border-radius:999px;font-size:16px}
.home-hero .cta{background:#10233A;color:#fff}
.cta:hover{filter:brightness(1.1)}
.pills{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--surface);margin:-40px 14px 0;border-radius:20px;padding:16px 10px;position:relative;z-index:2;box-shadow:0 6px 20px rgba(16,35,58,.08)}
.pills div{text-align:center;font-size:12px;color:var(--ink-3)}
.pills b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.progress-card{margin:18px 14px 8px;padding:16px;border-radius:18px;background:var(--sunk);display:flex;justify-content:space-between;align-items:center;gap:12px}
.progress-card .n{font-family:var(--display);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.progress-card small{color:var(--ink-3);display:block}
.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:170px;justify-content:flex-end}
.dots span{width:12px;height:12px;border-radius:50%;background:var(--line)}

/* clues */
.clue-stage{position:relative;padding:4px 14px 0;flex:1}
.clue-bg{position:absolute;inset:0 0 auto 0;height:320px;filter:blur(14px) saturate(1.1);opacity:.55;z-index:0}
.clue-list{position:relative;z-index:1;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);border-radius:20px;padding:6px 14px;list-style:none;margin:0;box-shadow:0 6px 24px rgba(16,35,58,.08)}
.clue{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.clue:last-child{border-bottom:0}
.clue svg{width:26px;height:26px;stroke:var(--ink-2);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.clue .k{font-size:12.5px;color:var(--ink-3)}
.clue .v{font-weight:600;font-size:15.5px;line-height:1.3;font-variant-numeric:tabular-nums}
.clue.locked .v{color:var(--ink-3);letter-spacing:.2em}
.clue.new{animation:pop .5s ease}
@keyframes pop{0%{background:var(--maybe-soft)}100%{background:transparent}}
.decide{background:var(--surface);border-radius:26px 26px 0 0;padding:20px 16px 18px;margin-top:14px;text-align:center;box-shadow:0 -8px 24px rgba(16,35,58,.06)}
.decide h2{font-size:24px;font-weight:800}
.decide p{color:var(--ink-3);margin:4px 0 14px;font-size:14px}
.votes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.vote{padding:16px 0;border-radius:14px;font-weight:700;font-size:18px;font-family:var(--display);transition:transform .12s}
.vote:hover{transform:translateY(-2px)}
.vote.yes{background:var(--yes);color:#fff}.vote.maybe{background:var(--maybe);color:var(--on-maybe)}.vote.no{background:var(--no);color:#fff}
.more{margin-top:14px;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--sunk);font-weight:600}
.more[disabled]{opacity:.45;cursor:default}
.left{font-size:12.5px;color:var(--ink-3);margin-top:6px}

/* reveal */
.reveal-hero{position:relative;height:230px;margin:0 0 0;overflow:hidden}
.reveal-hero canvas{width:100%;height:100%;display:block}
.reveal-title{padding:6px 18px 0;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.reveal-title h1{font-size:32px;font-weight:800;line-height:1.05}
.reveal-title .cc{font-size:12px;font-weight:700;letter-spacing:.1em;border:1.5px solid var(--ink);padding:3px 7px;border-radius:6px;flex:none}
.mine{margin:12px 18px 0;padding:10px 14px;border-radius:12px;font-weight:600;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mine small{font-weight:500;color:var(--ink-2)}
.body{padding:14px 18px 8px;display:flex;flex-direction:column;gap:18px}
.body>p{margin:0;color:var(--ink-2);max-width:65ch}
.sec h3{font-size:17px;font-weight:700;margin-bottom:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.facts div{font-size:12px;color:var(--ink-3)}
.facts b{display:block;color:var(--ink);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.facts .hid{position:relative}
.facts .hid::after{content:"was hidden";position:absolute;top:0;right:0;font-size:10px;color:var(--ink-3);background:var(--sunk);padding:0 5px;border-radius:4px}
ul.plain{margin:0;padding-left:18px;color:var(--ink-2)}
ul.plain li{margin:3px 0}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:4px 0 10px}
.bar span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.legend div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
.legend div.me{border:2px solid var(--ink)}
.legend b{display:block;font-size:20px;font-family:var(--display);font-variant-numeric:tabular-nums}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.note{font-size:11.5px;color:var(--ink-3);margin-top:6px}
.map{background:var(--sunk);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.map svg{display:block;width:100%;height:auto}
.foot{padding:12px 16px 18px}
.foot .cta{width:100%;justify-content:center}

/* stats & explore */
.page{padding:6px 18px 20px;display:flex;flex-direction:column;gap:18px;flex:1}
.page h1{font-size:28px;font-weight:800}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 div{border-radius:14px;padding:10px 12px}
.big3 b{font-family:var(--display);font-size:28px;display:block;font-variant-numeric:tabular-nums;line-height:1.1}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;margin:9px 0}
.row .lbl{font-size:14px}
.row .pct{font-weight:700;font-variant-numeric:tabular-nums}
.row .track{grid-column:1/-1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.row .track span{display:block;height:100%;background:var(--yes);border-radius:4px}
.insight{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;color:var(--ink-2)}
.insight strong{color:var(--ink)}
.empty{color:var(--ink-3);text-align:center;padding:30px 10px}
.lib{display:flex;flex-direction:column;gap:8px}
.lib button{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px 8px 8px}
.lib button:hover{border-color:var(--ink-3)}
.thumb{width:44px;height:44px;border-radius:10px}
.lib .nm{font-weight:600}.lib .ct{font-size:12.5px;color:var(--ink-3)}
.tag{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.tag.yes{background:var(--yes-soft);color:var(--yes)}.tag.maybe{background:var(--maybe-soft);color:#B08A0E}.tag.no{background:var(--no-soft);color:var(--no)}
.tag.none{background:var(--sunk);color:var(--ink-3)}
.linkbtn{color:var(--ink-3);font-size:13px;text-decoration:underline;align-self:center}

/* nav */
.nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--phone);padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));position:sticky;bottom:0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);padding:4px}
.nav button.on{color:var(--ink);font-weight:700}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* travel additions */
.nav{grid-template-columns:repeat(4,1fr)}
.daily{margin:18px 14px 0;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.daily .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.daily h3{font-size:19px;font-weight:700}
.daily p{margin:0;color:var(--ink-2);font-size:14px}
.daily .row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ghost{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--sunk);font-weight:600}
.ghost:hover{filter:brightness(.97)}
.vote{font-size:16px}
.save-row{display:flex;flex-direction:column;gap:8px;margin:12px 18px 0}
.savebtn{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:14px;font-weight:700;border:2px solid var(--ink);background:var(--surface)}
.savebtn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.savebtn.saved{background:var(--yes-soft);border-color:var(--yes);color:var(--ink)}
.savebtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.save-hint{font-size:12.5px;color:var(--ink-3);text-align:center}
.handoff{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--sunk);font-size:13px;color:var(--ink-2)}
.handoff b{color:var(--ink)}
.attr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.attr div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start}
.card .thumb{width:52px;height:52px;border-radius:12px}
.card .nm{font-weight:700;font-size:15.5px}
.card .meta{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.card .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.mini{font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:var(--sunk)}
.mini.plan{background:var(--navy);color:var(--on-navy)}
.star{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.star svg{width:22px;height:22px;stroke:var(--ink-3);fill:none;stroke-width:1.8;stroke-linejoin:round}
.star.on svg{fill:var(--maybe);stroke:#C99A12}
.savedtag{font-size:11.5px;font-weight:700;color:var(--ink-2);display:inline-flex;align-items:center;gap:4px;margin-top:4px}
.savedtag svg{width:13px;height:13px;stroke:currentColor;fill:currentColor}
.tagcol{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);padding:8px 12px;border-top:1px solid var(--line)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.filters button.on{background:var(--navy);color:var(--on-navy)}
.home-hero>.gear{position:absolute;top:18px;right:16px;z-index:2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);color:#10233A}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stylebar{margin:14px 14px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-radius:14px;background:var(--sunk);text-align:left;font-size:13.5px;color:var(--ink-2)}
.stylebar b{color:var(--ink)}
.stylebar span.e{font-weight:700;color:var(--ink);flex:none}
.foryou{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--maybe-soft);color:var(--ink);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:9px 14px;border-radius:999px;background:var(--sunk);font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--navy);color:var(--on-navy)}
.field{display:flex;flex-direction:column;gap:8px}
.field .hint{font-size:12.5px;color:var(--ink-3)}
select{font:inherit;font-size:15px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
.why{margin:10px 18px 0;display:flex;flex-direction:column;gap:8px}
.why .q{font-size:13px;color:var(--ink-3)}
.why .seg button{font-size:13px;padding:7px 12px}
.seasonbox{padding:12px 14px;border-radius:12px;background:var(--maybe-soft);font-size:14px}
.appicon{width:56px;height:56px;border-radius:14px;box-shadow:0 6px 16px rgba(16,35,58,.25);display:block;margin-bottom:16px}
/* free edition additions */

 x.fillStyle=dk+"66"; x.beginPath(); x.moveTo(0,h);
 for(let i=0;i<=10;i++){ x.lineTo(i*w/10, h*(tall?.3:.55)+r()*h*(tall?.28:.1)); }
 x.lineTo(w,h); x.fill();
 const coast=(d.tags||[]).includes("coastal");
 if(coast){ x.fillStyle=dk+"AA"; x.fillRect(0,h*.72,w,h*.28);
   x.strokeStyle="rgba(255,255,255,.35)"; x.lineWidth=1.2;
   for(let i=0;i<6;i++){ const y=h*.76+i*h*.035; x.beginPath(); x.moveTo(r()*w*.3,y); x.lineTo(w*.5+r()*w*.5,y); x.stroke(); } }
 if(blurOnly) return;
 x.fillStyle=dk; const base = coast? h*.74 : h*.9;
 const big=(d.tags||[]).includes("bigcity"), small=d.kind!=="City";
 let px=0; while(px<w){ const bw=10+r()*26, bh=small? 8+r()*16 : 12+r()*(big?70:38);
   if(!small || r()>.35){ x.fillRect(px,base-bh,bw-2,bh);
   if(r()>.75){ x.beginPath(); x.moveTo(px,base-bh); x.lineTo(px+(bw-2)/2,base-bh-12); x.lineTo(px+bw-2,base-bh); x.fill(); } }
   px+=bw; }
 if(!coast){ x.fillRect(0,base,w,h-base); }
 x.fillStyle="rgba(255,240,200,.55)";
 for(let i=0;i<40;i++){ x.fillRect(r()*w, base-r()*30, 2, 2); }
}

function mapSVG(highlight, filter){
 const W=360,H=180, P=(lat,lon)=>[(lon+180)/360*W,(90-lat)/180*H];
 let g=""; for(let lon=-150;lon<=150;lon+=30){const[x]=P(0,lon);g+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="var(--line)" stroke-width=".6"/>`}
 for(let lat=-60;lat<=60;lat+=30){const[,y]=P(lat,0);g+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="var(--line)" stroke-width="${lat===0?1.4:.6}"/>`}
 const col={yes:"var(--yes)",maybe:"var(--maybe)",no:"var(--no)"};
 let dots="";
 DEST.forEach(d=>{ const h=S.history[d.id]; if(!h || (highlight&&highlight.id===d.id)) return;
   const saved=!!S.travelList[d.id];
   if(filter==="saved" && !saved) return;
   const[x,y]=P(d.lat,d.lon);
   if(saved) dots+=`<circle cx="${x}" cy="${y}" r="6.5" fill="none" stroke="var(--ink)" stroke-width="1.4"/>`;
   dots+=`<circle cx="${x}" cy="${y}" r="3.6" fill="${col[h.answer]}"/>`;});
 if(highlight){const[x,y]=P(highlight.lat,highlight.lon);
   dots+=`<circle cx="${x}" cy="${y}" r="10" fill="var(--no)" opacity=".2"/><circle cx="${x}" cy="${y}" r="5" fill="var(--no)" stroke="var(--surface)" stroke-width="1.5"/>`;
   const right = x>W-110;
   dots+=`<text x="${right?x-9:x+10}" y="${y+4}" font-size="11" font-weight="700" fill="var(--ink)" text-anchor="${right?"end":"start"}" font-family="Figtree,sans-serif">${highlight.name}</text>`}
 const lab=(t,lat,lon)=>{const[x,y]=P(lat,lon);return `<text x="${x}" y="${y}" font-size="8" fill="var(--ink-3)" text-anchor="middle" letter-spacing="1" font-family="Figtree,sans-serif">${t}</text>`};
 const labs=lab("EQUATOR",3,-150)+lab("N. AMERICA",62,-105)+lab("S. AMERICA",-18,-60)+lab("EUROPE",66,12)+lab("AFRICA",4,20)+lab("ASIA",58,95)+lab("OCEANIA",-28,135);
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of discovered destinations">${g}${labs}${dots}</svg>`;
}

const REGIONS = ["North America","Central America & Caribbean","South America","Europe","Africa","Middle East & Caucasus","Asia","Oceania"];
function viewStats(){
 const ans = Object.entries(S.history).map(([id,h])=>({d:byId(id),a:h.answer})).filter(x=>x.d);
 const n=ans.length, cnt=k=>ans.filter(x=>x.a===k).length, st=streak();
 const stamps = REGIONS.map(r=>{ const inR=DEST.filter(d=>d.region===r).length, seen=ans.filter(x=>x.d.region===r).length;
   return `<div class="stamp ${seen?"on":""}"><span class="ring">${({"North America":"N.AM","Central America & Caribbean":"CAR","South America":"S.AM","Middle East & Caucasus":"ME"})[r]||r.slice(0,3).toUpperCase()}</span><b>${r}</b><small>${seen} of ${inR}</small></div>`; }).join("");
 const regionsSeen = REGIONS.filter(r=>ans.some(x=>x.d.region===r)).length;
 const ms = [
  ["First discovery", n>=1], ["10 destinations", n>=10], ["25 destinations", n>=25], ["50 destinations", n>=50], ["100 destinations", n>=100], [`All ${DEST.length}`, n>=DEST.length],
  ["First place saved", Object.keys(S.travelList).length>=1], ["3-day streak", st>=3], ["7-day streak", st>=7], ["Every region", regionsSeen===REGIONS.length]
 ].map(([l,ok])=>`<div class="ms ${ok?"on":""}"><span>${ok?"✓":""}</span>${l}</div>`).join("");
 let body = `<div class="sec"><h3>Passport stamps</h3><div class="stamps">${stamps}</div></div>
  <div class="sec"><h3>Milestones</h3><div class="milestones">${ms}</div></div>`;
 if(n<3){
  body += `<div class="empty">Play at least 3 destinations to see your travel pattern.</div>`;
 } else {
  const yes = ans.filter(x=>x.a==="yes").map(x=>x.d);
  const saved = Object.keys(S.travelList).map(byId).filter(Boolean);
  const pct=(arr,t)=>arr.length?Math.round(arr.filter(d=>d.tags.includes(t)).length/arr.length*100):0;
  const traits = Object.keys(TRAITS).map(t=>({t,l:TRAITS[t],y:pct(yes,t),all:pct(ans.map(x=>x.d),t),s:pct(saved,t)})).sort((a,b)=>b.y-a.y);
  const leans = yes.length>=2 ? traits.filter(t=>t.y>=t.all+15 && t.y>=50).slice(0,2) : [];
  const savedTop = saved.length>=2 ? traits.slice().sort((a,b)=>b.s-a.s)[0] : null;
  const lines = [];
  if(!yes.length) lines.push(`You haven't said Absolutely yet. Keep playing and a pattern will show up.`);
  else if(leans.length) lines.push(`You say Absolutely to <strong>${leans.map(t=>t.l.toLowerCase()).join("</strong> and <strong>")}</strong> destinations more often than they come up in your games.`);
  else lines.push(`No strong lean yet. Your Absolutely picks look like the mix you've played.`);
  if(savedTop && savedTop.s>=60) lines.push(`${savedTop.s}% of the places you've saved are <strong>${savedTop.l.toLowerCase()}</strong>.`);
  const passes = ans.filter(x=>x.a!=="yes").map(x=>S.history[x.d.id]).filter(h=>h&&h.reason);
  if(passes.length>=2){ const rc={}; passes.forEach(h=>rc[h.reason]=(rc[h.reason]||0)+1);
    const top=Object.entries(rc).sort((a,b)=>b[1]-a[1])[0];
    lines.push(top[0]==="season" ? `${top[1]} of the ${passes.length} times you gave a reason, it was <strong>the time of year</strong>, not the place.` : `When you pass on a place, the most common reason you give is <strong>${REASONS[top[0]].toLowerCase()}</strong> (${top[1]} of ${passes.length}).`); }
  const regions=[...new Set(ans.map(x=>x.d.region))].map(r=>{const rs=ans.filter(x=>x.d.region===r);return{r,n:rs.length,p:Math.round(rs.filter(x=>x.a==="yes").length/rs.length*100)}}).sort((a,b)=>b.p-a.p);
  body += `
   <div class="big3"><div style="background:var(--yes-soft)"><b>${cnt("yes")}</b>Absolutely</div><div style="background:var(--maybe-soft)"><b>${cnt("maybe")}</b>Maybe</div><div style="background:var(--no-soft)"><b>${cnt("no")}</b>Not for me</div></div>
   <div class="insight">${lines.join("<br><br>")}</div>
   ${!yes.length?"":`<div class="sec"><h3>What your Absolutely picks have in common</h3><div class="note" style="margin:0 0 4px">Share of your ${yes.length} Absolutely ${yes.length===1?"answer":"answers"} with each trait</div>
    ${traits.map(t=>`<div class="row"><span class="lbl">${t.l}</span><span class="pct">${t.y}%</span><div class="track"><span style="width:${t.y}%"></span></div></div>`).join("")}</div>`}
   <div class="sec"><h3>By region</h3>${regions.map(r=>`<div class="row"><span class="lbl">${r.r} <span style="color:var(--ink-3)">· ${r.n} played</span></span><span class="pct">${r.p}% Absolutely</span><div class="track"><span style="width:${r.p}%"></span></div></div>`).join("")}</div>
   <div class="note">Based only on your answers in this game.</div>`;
 }
 app.innerHTML = `<div class="screen"><div class="page"><h1>My Passport</h1>
  <div class="big3"><div style="background:var(--sunk)"><b>${n}</b>Discovered</div><div style="background:var(--sunk)"><b>${st}</b>Day streak</div><div style="background:var(--sunk)"><b>${regionsSeen}/${REGIONS.length}</b>Regions</div></div>
  ${body}<button class="ghost" data-nav="settings" style="align-self:flex-start">Back up my progress</button></div>${nav("stats")}</div>`;
}

/* ---------- backup and restore ---------- */
function makeBackup(){ const json=JSON.stringify({v:1,prefs:S.prefs,history:S.history,travelList:S.travelList});
 return "WYTT1-"+btoa(unescape(encodeURIComponent(json))); }
function readBackup(code){ code=(code||"").replace(/\s+/g,"");
 if(!code.startsWith("WYTT1-")) throw new Error("That doesn't look like a backup code. It should start with WYTT1-.");
 let o; try{ o=JSON.parse(decodeURIComponent(escape(atob(code.slice(6))))); }catch(e){ throw new Error("That code is incomplete or damaged. Try copying the whole code again."); }
 if(!o||typeof o.history!=="object") throw new Error("That code is incomplete or damaged. Try copying the whole code again.");
 return o; }
function mergeBackup(o){ let added=0;
 Object.entries(o.history||{}).forEach(([id,h])=>{ if(!byId(id)) return; const cur=S.history[id]; if(!cur||(h.playedAt||0)>(cur.playedAt||0)){ if(!cur) added++; S.history[id]=h; } });
 Object.entries(o.travelList||{}).forEach(([id,t])=>{ if(byId(id)&&!S.travelList[id]) S.travelList[id]=t; });
 if(o.prefs) S.prefs=Object.assign(S.prefs,o.prefs);
 save(); return added; }
function backupBlock(){
 return `<div class="sec backup"><h3>Back up my progress</h3>
  <p class="note" style="margin:0 0 10px;font-size:13px">Your progress is saved in this browser only. Copy a backup code and keep it somewhere safe, like your notes app or an email to yourself. You can restore it on any device. Copy a fresh code every so often so you never lose your progress.</p>
  <button class="ghost" data-backup="1">${copySVG}Copy my backup code</button>${copyBox("backup")}
  <label for="restoreCode" class="note" style="display:block;margin:14px 0 6px;font-size:13px;color:var(--ink-2)">Restore from a code</label>
  <textarea id="restoreCode" rows="3" placeholder="Paste your backup code here"></textarea>
  <button class="ghost" data-restore="1" style="margin-top:8px">Restore my progress</button>
  ${S.restoreMsg?`<div class="copied ${S.restoreMsg.ok?"":"err"}">${esc(S.restoreMsg.text)}</div>`:""}
 </div>`; }

/* ---------- flow ---------- */
function play(id, day){ if(!id){ S.view="stats"; return render(); } S.current=id; S.currentDay=(day==null?null:day); S.shown=base(byId(id)); S.view="play"; render(); }
function render(){
 applyTheme(getTheme());
 ({settings:viewSettings,archive:viewArchive,style:viewStyle,home:viewHome,play:viewPlay,reveal:()=>viewReveal(S.revealId),list:viewList,history:viewHistory,stats:viewStats})[S.view]();
 if(!S.keepScroll) window.scrollTo(0,0);
 S.keepScroll=false;
}
async function doCopy(key,text){
 try{ await navigator.clipboard.writeText(text); S.copied={key,ok:true,text}; }
 catch(e){ S.copied={key,ok:false,text}; }
 S.keepScroll=true; render();
}
let resetArmed=false;
app.addEventListener("click", e=>{
 const t=e.target.closest("button"); if(!t) return;
 const D=t.dataset;
 if(D.nav){ S.view=D.nav; S.note=null; S.copied=null; S.restoreMsg=null; resetArmed=false; render(); }
 else if(D.day){ const day=+D.day, id=dailyIdFor(day), h=S.history[id];
   const from = (S.view==="archive"||D.fromarch)?"archive":"home";
   if(h && h.dailyNo===dailyNoFor(day)){ S.revealId=id; S.from=from; S.view="reveal"; render(); }
   else { S.playFrom=from; play(id, day); } }
 else if(D.tour){ startTour(); }
 else if(D.theme){ const t=D.theme==="dark"?"dark":"light"; try{localStorage.setItem(THEME_KEY,t)}catch(e){} S.prefs.theme=t; save(); applyTheme(t); S.keepScroll=true; render(); }
 else if(D.go==="practice") play(nextUnplayed(), null);
 else if(D.go==="clue"){ if(S.shown<total(byId(S.current))){ S.shown++; viewPlay(); } }
 else if(D.vote){ const rec={answer:D.vote,playedAt:Date.now(),cluesUsed:S.shown,cluesTotal:total(byId(S.current))};
   if(S.currentDay!=null){ rec.dailyNo=dailyNoFor(S.currentDay); rec.onTime=S.currentDay===TODAY; }
   S.history[S.current]=rec; save(); S.revealId=S.current; S.from=S.playFrom||"home"; S.playFrom=null; S.note=null; S.copied=null; S.view="reveal"; render(); }
 else if(D.open){ S.from=S.view==="reveal"?"home":S.view; S.revealId=D.open; S.note=null; S.copied=null; S.view="reveal"; render(); }
 else if(D.save){ const h=S.history[D.save]; S.travelList[D.save]={savedAt:Date.now(),favorite:false,forSeason:!!(h&&h.reason==="season")}; save(); S.keepScroll=true; render(); }
 else if(D.unsave){ delete S.travelList[D.unsave]; save(); S.keepScroll=true; render(); }
 else if(D.fav){ const x=S.travelList[D.fav]; if(x){x.favorite=!x.favorite; save(); S.keepScroll=true; render();} }
 else if(D.why){ const h=S.history[S.revealId]; if(h){ h.reason = h.reason===D.why?null:D.why; save(); S.keepScroll=true; render(); } }
 else if(D.pref){ const [k,v]=D.pref.split(":"); S.prefs[k]=v; save(); S.keepScroll=true; render(); }
 else if(D.share){ doCopy("share-"+D.share, shareText(D.share)); }
 else if(D.sharelist){ const lines=Object.keys(S.travelList).map(byId).filter(Boolean).map(d=>`• ${placeName(d)} (best ${d.best})`);
   doCopy("list", "My Travel List from Would You Travel There?\n"+lines.join("\n")); }
 else if(D.backup){ doCopy("backup", makeBackup()); }
 else if(D.restore){ const el=document.getElementById("restoreCode");
   try{ const o=readBackup(el&&el.value); const n=mergeBackup(o); S.restoreMsg={ok:true,text:`Restored. ${n} destination${n===1?"":"s"} added to this device. Nothing already here was removed.`}; }
   catch(err){ S.restoreMsg={ok:false,text:err.message}; }
   S.keepScroll=true; render(); }
 else if(D.af){ S.aFilter=D.af; S.keepScroll=true; render(); }
 else if(D.hf){ S.hFilter=D.hf; S.keepScroll=true; render(); }
 else if(D.go==="reset"){
   if(!resetArmed){ resetArmed=true; t.textContent="Tap again to clear history and Travel List"; return; }
   S.history={}; S.travelList={}; S.order=shuffle(DEST.map(d=>d.id)); save(); resetArmed=false; S.view="home"; render(); }
});
load(); ensureOrder(); save();
(function openShared(){ let tok=""; try{ tok=(location.hash||"").slice(1); }catch(e){}
 const day=dayFromToken(tok);
 if(day!=null && day>=LAUNCHDAY && day<=TODAY){ const id=dailyIdFor(day), h=S.history[id];
   if(h && h.dailyNo===dailyNoFor(day)){ S.revealId=id; S.from="home"; S.view="reveal"; }
   else { S.current=id; S.currentDay=day; S.shown=base(byId(id)); S.view="play"; } }
 try{ if(tok) history.replaceState(null,"",location.pathname+location.search); }catch(e){}
})();
render();

   First visit, replay from "How to play" or Settings. ---------- */
function latestPlayed(){ const e=Object.entries(S.history).filter(([id])=>byId(id)).sort((a,b)=>(b[1].playedAt||0)-(a[1].playedAt||0))[0]; return e?e[0]:null; }
const TOUR=[
 {view:"home",sel:[".home-hero h1"],e:"👋",h:"Welcome to Would You Travel There?",b:`<p>Every day there's a new mystery destination somewhere in the world. You read clues about what a trip there is like, decide if you'd go, and then find out where it is.</p>`},
 {view:"home",sel:[".home-hero .cta"],e:"🧭",h:"Start here",b:`<p>Tap this button to play today's mystery destination. Let's take a look at what you'll see.</p>`},
 {view:"play",sel:[".clue-list"],e:"🔍",h:"Read the clues",b:`<p>Clues describe the trip: weather, cost, food, getting around and more. No names, so you judge the place on what it's like.</p>`},
 {view:"play",sel:[".more"],e:"➕",h:"Want more clues?",b:`<p>Tap <b>Need another clue?</b> to reveal one more. The last clue is the language, so the country stays a mystery as long as possible.</p>`},
 {view:"play",sel:[".votes"],e:"🤔",h:"Make your call",b:`<p>Based on the clues, would you go? Choose <b>Absolutely</b>, <b>Maybe</b> or <b>Not for me</b>. There are no wrong answers.</p>`},
 {view:"reveal",sel:[".save-row",".reveal-title"],e:"🗺️",h:"The reveal",b:`<p>Then you find out where it is, with things to see, the best months to go and rough costs.</p><p>Tap <b>Save to My Travel List</b> for places you'd love to visit.</p>`},
 {view:"home",sel:[".week"],e:"📅",h:"A new place every day",b:`<p>Everyone gets the same destination each day, so you can compare answers with friends. Missed a day? Play it anytime from <b>This week</b>.</p>`},
 {view:"home",sel:[".nav"],e:"🛂",h:"Your tabs",b:`<p><b>Travel List</b> has the places you saved, <b>History</b> has everything you've played, and <b>Passport</b> shows your stats and stamps.</p>`},
 {view:"home",sel:[".home-hero .gear"],e:"🎉",h:"You're all set",b:`<p>Tap the <b>gear</b> to switch between light and dark, back up your progress, or replay this tour.</p>`}
];
let TOUR_I=null, tourEls=null;
function tourShowView(st){
 if(st.view==="play"){
   if(S.view!=="play"||S.current!==TODAY_ID){ S.current=TODAY_ID; S.currentDay=TODAY; S.shown=base(byId(TODAY_ID)); S.playFrom="home"; S.view="play"; render(); } }
 else if(st.view==="reveal"){
   const id=latestPlayed();
   if(id){ if(S.view!=="reveal"||S.revealId!==id){ S.revealId=id; S.from="home"; S.view="reveal"; render(); } }
   else if(S.view!=="play"){ S.current=TODAY_ID; S.currentDay=TODAY; S.shown=base(byId(TODAY_ID)); S.playFrom="home"; S.view="play"; render(); } }
 else if(S.view!==st.view){ S.view=st.view; render(); }
}
function tourTarget(){
 const st=TOUR[TOUR_I]; if(st.view==="reveal" && !latestPlayed()) return null;
 for(const sel of st.sel){ const el=document.querySelector(sel); if(el){ const r=el.getBoundingClientRect(); if(r.width>0&&r.height>0) return el; } }
 return null;
}
function drawTour(){
 if(TOUR_I==null){ if(tourEls){ Object.values(tourEls).forEach(x=>x.remove()); tourEls=null; } return; }
 if(!tourEls){
   tourEls={block:document.createElement("div"),spot:document.createElement("div"),card:document.createElement("div")};
   tourEls.block.className="tour-block"; tourEls.spot.className="tour-spot"; tourEls.card.className="tourbox tour-card";
   tourEls.card.setAttribute("role","dialog"); tourEls.card.setAttribute("aria-modal","true"); tourEls.card.setAttribute("aria-labelledby","tourh");
   document.body.append(tourEls.block,tourEls.spot,tourEls.card);
   tourEls.card.addEventListener("click",e=>{ const b=e.target.closest("[data-tt]"); if(!b) return; const a=b.dataset.tt;
     if(a==="next"){ TOUR_I=Math.min(TOUR.length-1,TOUR_I+1); drawTour(); } else if(a==="prev"){ TOUR_I=Math.max(0,TOUR_I-1); drawTour(); } else endTour(); });
 }
 const t=TOUR[TOUR_I], last=TOUR_I===TOUR.length-1, i=TOUR_I;
 const noReveal = t.view==="reveal" && !latestPlayed();
 tourEls.card.innerHTML=`<div class="tourtop"><span>${TOUR_I+1} OF ${TOUR.length}</span>${last?"":`<button class="tourskip" data-tt="end">Skip tour</button>`}</div>
  <h2 id="tourh"><span aria-hidden="true">${t.e}</span> ${t.h}</h2>${t.b}${noReveal?`<p style="font-size:13px">You'll see your first reveal after you play.</p>`:""}
  <div class="tourdots" aria-hidden="true">${TOUR.map((_,k)=>`<i class="${k===TOUR_I?"on":""}"></i>`).join("")}</div>
  <div class="tourfoot">${TOUR_I>0?`<button class="ghost" data-tt="prev">Back</button>`:""}<button class="cta" data-tt="${last?"end":"next"}">${last?"Start playing":TOUR_I===0?"Show me around":"Next"}</button></div>`;
 tourEls.card.style.visibility="hidden";
 tourShowView(t);
 setTimeout(()=>{ if(TOUR_I!==i||!tourEls) return;
   const el=tourTarget(); if(el) el.scrollIntoView({block:"center",behavior:"auto"});
   placeTour(); tourEls.card.style.visibility="";
   const b=tourEls.card.querySelector(".tourfoot .cta"); if(b) b.focus({preventScroll:true}); }, 60);
}
function placeTour(){
 if(TOUR_I==null||!tourEls) return;
 const el=tourTarget(), spot=tourEls.spot, card=tourEls.card;
 const vw=window.innerWidth, vh=window.innerHeight, cw=card.offsetWidth, ch=card.offsetHeight;
 if(!el){ spot.style.cssText="left:50%;top:50%;width:0;height:0"; card.style.left=Math.max(16,(vw-cw)/2)+"px"; card.style.top=Math.max(16,(vh-ch)/2)+"px"; return; }
 const r=el.getBoundingClientRect(), pad=8, top=Math.max(6,r.top-pad), h=Math.min(r.height+pad*2, vh-top-6);
 spot.style.cssText=`left:${r.left-pad}px;top:${top}px;width:${r.width+pad*2}px;height:${h}px`;
 const left=Math.min(Math.max(16,r.left), vw-cw-16), below=top+h+12, above=top-ch-12;
 card.style.left=left+"px"; card.style.top=(below+ch<vh-8?below:above>8?above:vh-ch-16)+"px";
}
window.addEventListener("resize",placeTour);
window.addEventListener("scroll",placeTour,{passive:true});
function startTour(){ TOUR_I=0; drawTour(); }
function endTour(){ TOUR_I=null; drawTour(); if(!S.prefs.tourDone){ S.prefs.tourDone=true; save(); } if(S.view!=="home"){ S.view="home"; render(); } }
document.addEventListener("keydown",e=>{ if(TOUR_I==null) return;
 if(e.key==="Escape"){ e.preventDefault(); endTour(); }
 else if(e.key==="ArrowRight"&&TOUR_I<TOUR.length-1){ TOUR_I++; drawTour(); }
 else if(e.key==="ArrowLeft"&&TOUR_I>0){ TOUR_I--; drawTour(); } });
if(!S.prefs.tourDone) startTour();
</script>
</body>
</html>
